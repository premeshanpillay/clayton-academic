<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes — Clayton House</title>
<meta name="description" content="Notes, summaries and past papers for Clayton House, organised by grade and subject.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
  /* Apply the saved theme before the page paints, so it never flashes the
     wrong one. No stored choice means we fall through to the OS preference. */
  try {
    var t = localStorage.getItem("clayton-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="/">Clayton</a>
    <nav class="nav__links" aria-label="Main">
      <a class="nav__link" href="/">Home</a>
      <a class="nav__link" href="/notes" aria-current="page">Notes</a>
      <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode">
        <svg class="switch__icon switch__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 1.6v2.2M12 20.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M1.6 12h2.2M20.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>
        <svg class="switch__icon switch__icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.3 14.9A8.6 8.6 0 019.1 3.7a8.6 8.6 0 1011.2 11.2z"/>
        </svg>
        <span class="switch__knob"></span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap" id="view">
  <!-- Rendered by assets/app.js -->
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>Clayton House — Academic Resources</span>
    <span>Made for the house, by the house.</span>
  </div>
</footer>

<script src="assets/theme.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
